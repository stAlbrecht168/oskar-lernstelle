name: Lernstelle veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: JavaScript Syntax prüfen
        run: |
          node --check study-v04.js
          node --check journey-media-v07.js
          node --check journeys-v05.js
          node --check journey-generator-v06.js
          node --check connections-v07.js
          node --check planner-v08.js
          node --check assessment-core-v08.js
          node --check assessment-v08.js
          node --check auto-material-v09.js
          node --check local-folder-v10.js
          node --check knowledge-core-v10.js
          node --check knowledge-files-v10.js
          node --check knowledge-v10.js
      - name: Statische Dateien vorbereiten
        run: |
          mkdir -p public
          cp index.html study-v04.js journey-media-v07.js journeys-v05.js journey-generator-v06.js connections-v07.js planner-v08.js assessment-core-v08.js assessment-v08.js auto-material-v09.js knowledge-core-v10.js knowledge-files-v10.js knowledge-v10.js local-folder-v10.js public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
